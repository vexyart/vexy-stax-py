# this_file: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for hatch-vcs

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uvx ruff check src tests

      - name: Run tests
        # Engine tests (blender/pygfx/playwright) self-skip when their backend
        # is unavailable on the runner, so the suite stays green in CI.
        run: uv run pytest

      - name: Validate package build
        run: uv build
