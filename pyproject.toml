[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-stax"
dynamic = ["version"]
description = "Render layered PNGs as 3D glass plates in two views, from a shared JSON scene format"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fire",
    "rich",
    "pillow",
    "numpy",
    "pydantic>=2",
    "opencv-python-headless",
    "pygfx>=0.16.0",
    "pylinalg>=0.6.8",
    "playwright>=1.60.0",
]

[project.urls]
Homepage = "https://github.com/vexyart/vexy-stax-py"
Repository = "https://github.com/vexyart/vexy-stax-py"

[project.scripts]
vexy-stax = "vexy_stax.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "3.0.1"

[tool.hatch.build.hooks.vcs]
version-file = "src/vexy_stax/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_stax"]
artifacts = ["src/vexy_stax/fonts/*.ttf", "src/vexy_stax/fonts/*.txt"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
cov = "pytest --cov=vexy_stax {args:tests}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "blender: tests that invoke the real Blender binary (skipped if absent)",
    "pygfx: tests that drive the pygfx GPU renderer (skipped if not importable)",
    "playwright: tests that drive the JS build in headless Chromium (skipped if unavailable)",
    "slow: long-running tests (e.g. video renders); opt-in via -m slow",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
