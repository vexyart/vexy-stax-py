# this_file: pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-stax"
dynamic = ["version"]
description = "Headless 3D renderer for layered image stacks with depth effects (pygfx + Playwright)"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Fontlab Ltd.", email = "support@fontlab.com"},
]
keywords = ["image", "stacking", "automation", "playwright", "3d", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=11.0.0",
    "fire>=0.6.0",
    "numpy>=1.26.0",
    "imageio[ffmpeg]>=2.36.0",
    "pydantic>=2.8.0",
    "pygfx>=0.15.0",
    "wgpu[glfw]>=0.17.0",
    "rich>=14.2.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
all = [
    "playwright>=1.40.0",
]

[project.scripts]
vexy-stax = "vexy_stax.cli:main"
vexy-stax-create-test = "vexy_stax.create_test_images:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/vexy_stax/_version.py"

[tool.hatch.envs."hatch-test"]
skip-install = true
dependencies = [
  "pillow",
  "pytest",
  "numpy",
  "imageio",
  "pydantic",
  "fire",
  "playwright",
  "pygfx",
  "wgpu",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "unit: Unit tests (isolated, fast, no external dependencies)",
    "integration: Integration tests (multiple components, may use stubs)",
    "gpu_required: Tests requiring GPU hardware (skipped if unavailable)",
    "slow: Slow tests (>1s per test)",
    "playwright: Tests requiring Playwright browser automation",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
