title: vexy-stax-py
description: >-
  Render layered PNG slides as 3D glass plates — in expanded and compact views
  with animated transitions — from a shared JSON scene format.

baseurl: "/vexy-stax-py"
url: "https://vexy.dev"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

# just-the-docs navigation settings
nav_sort: case_insensitive
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2026 Fontlab Ltd. MIT License."

color_scheme: light

# Permalink style
permalink: pretty

# Exclude from build
exclude:
  - "*.sh"
  - "Gemfile"
  - "Gemfile.lock"
