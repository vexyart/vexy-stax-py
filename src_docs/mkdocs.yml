# this_file: src_docs/mkdocs.yml
site_name: vexy-stax-py
site_description: Render layered PNGs as 3D glass plates in two views, from a shared JSON scene format
site_url: https://vexy.dev/vexy-stax-py/
repo_url: https://github.com/vexyart/vexy-stax-py
repo_name: vexyart/vexy-stax-py
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Concepts: concepts.md
  - Scene format:
      - Overview: scene-format.md
      - Reference: scene-reference.md
      - Captions: captions.md
  - Rendering:
      - CLI: cli.md
      - Engines: engines.md
      - Geometry: geometry.md
      - Python API: python-api.md
      - vexy-stax-js: browser.md
  - Project:
      - Architecture and contributing: architecture.md
      - Troubleshooting: troubleshooting.md
